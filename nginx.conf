server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Don't allow the site to be embedded in an iframe
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Always revalidate all files with ETag
    etag on;
    add_header Cache-Control "public, no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location /js/pa-rDR1pWZBRKDTvFE5ffKvX.js {
        proxy_pass https://stats.loopwerk.io/js/pa-rDR1pWZBRKDTvFE5ffKvX.js;
        proxy_set_header Host stats.loopwerk.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
    }

    location /api/event {
        proxy_pass https://stats.loopwerk.io/api/event;
        proxy_set_header Host stats.loopwerk.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_http_version 1.1;
        proxy_set_header X-Plausible-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
